name: Benchmark validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked evaluator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run evaluator regression tests
        run: npm test
      - name: Validate all six fixture control pairs
        run: npm run benchmark:controls

  # Actual model comparisons deliberately remain manual; they require an
  # authenticated agent runtime and must not be confused with fixture controls.
